<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surat Otomatis SMA YWKA</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
    .container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
    input { width: 100%; padding: 10px; margin: 8px 0 20px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 20px; text-align: center; padding: 10px; border-radius: 5px; display: none; }
    .success { background-color: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align:center; color:#333;">Surat Perintah YWKA</h2>
    <form id="formSurat">
      <label>Nomor Surat:</label>
      <input type="text" id="noSurat" required placeholder="Contoh: 421.7/586/SMA YWKA/TU/IX/2026">
      
      <label>Tujuan Acara:</label>
      <input type="text" id="acara" required>
      
      <label>Nama Pegawai:</label>
      <input type="text" id="nama" required>
      
      <label>Jabatan:</label>
      <input type="text" id="jabatan" required>
      
      <label>Tanggal Acara:</label>
      <input type="date" id="tanggal" required>
      
      <label>Tempat Acara:</label>
      <input type="text" id="tempat" required>
      
      <button type="submit" id="btnSubmit">Buat & Simpan ke Drive</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA
    const URL_GAS = "https://script.google.com/macros/s/AKfycbzo6Uj2hJhbgXINF_856LVZRyErDfKu8d15QqFT8aL7d8IigImaDLfgSR0vdV8s95Kx/exec"; 

    document.getElementById('formSurat').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const statusDiv = document.getElementById('status');
      
      btn.innerText = "Memproses Data...";
      btn.disabled = true;
      statusDiv.style.display = "none";

      const data = {
        noSurat: document.getElementById('noSurat').value,
        acara: document.getElementById('acara').value,
        nama: document.getElementById('nama').value,
        jabatan: document.getElementById('jabatan').value,
        tanggal: document.getElementById('tanggal').value,
        tempat: document.getElementById('tempat').value
      };

      try {
        const response = await fetch(URL_GAS, {
          method: "POST",
          // Menggunakan text/plain menghindari masalah CORS saat koneksi dari Vercel ke Google
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        
        if(result.status === 'success') {
          statusDiv.className = "success";
          statusDiv.innerHTML = `Berhasil! <a href="${result.url}" target="_blank">Unduh PDF Surat</a>`;
          statusDiv.style.display = "block";
          document.getElementById('formSurat').reset();
        }
      } catch (error) {
        alert("Terjadi kesalahan sistem.");
        console.error(error);
      } finally {
        btn.innerText = "Buat & Simpan ke Drive";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
